<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scanner Check-in PWA</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">

  <!-- LIB QR SCANNER (WAJIB INI) -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #111;
      color: white;
      text-align: center;
    }

    header {
      padding: 15px;
      background: #000;
      font-weight: bold;
      font-size: 18px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
    }

    button {
      margin-top: 15px;
      padding: 12px 20px;
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
    }

    #result {
      margin-top: 15px;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header>
    ADMIN SCANNER CHECK-IN
  </header>

  <button onclick="startCamera()">📷 BUKA KAMERA</button>

  <div id="reader"></div>

  <div id="result">Menunggu scan...</div>

  <script>

    let html5QrCode;
    let scanning = false;

    // =========================
    // START CAMERA
    // =========================
    function startCamera() {

      html5QrCode = new Html5Qrcode("reader");

      Html5Qrcode.getCameras().then(cameras => {

        if (!cameras || cameras.length === 0) {
          alert("Kamera tidak ditemukan");
          return;
        }

        let cameraId = cameras[0].id;

        // pilih kamera belakang
        cameras.forEach(c => {
          if (c.label.toLowerCase().includes("back")) {
            cameraId = c.id;
          }
        });

        html5QrCode.start(
          cameraId,
          {
            fps: 10,
            qrbox: 250
          },
          onScanSuccess
        );

      }).catch(err => {
        alert("Gagal akses kamera: " + err);
      });
    }

    // =========================
    // HANDLE SCAN
    // =========================
    function onScanSuccess(text) {

      if (scanning) return;
      scanning = true;

      console.log("QR RAW:", text);

      let data;

      try {
        data = JSON.parse(text);
      } catch (e) {

        document.getElementById("result").innerText =
          "QR tidak valid";

        scanning = false;
        return;
      }

      if (!data.regId) {

        document.getElementById("result").innerText =
          "QR tidak punya regId";

        scanning = false;
        return;
      }

      // =========================
      // KIRIM KE APPS SCRIPT
      // =========================
      google.script.run
        .withSuccessHandler(res => {

          const el = document.getElementById("result");

          if (res.success) {

            el.innerHTML =
              "✅ " + data.nama + " (" + data.regId + ") HADIR";

            el.style.color = "lime";

          } else {

            el.innerHTML =
              "❌ " + res.message;

            el.style.color = "red";
          }

          setTimeout(() => scanning = false, 2000);

        })
        .checkInPeserta(data.regId);
    }

  </script>

</body>

</html>
