<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scanner PWA</title>

  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin:0;
      font-family:sans-serif;
      background:#111;
      color:white;
      text-align:center;
    }

    video {
      width:100%;
      max-width:500px;
      border-radius:10px;
      margin-top:10px;
    }

    button {
      padding:12px 20px;
      background:green;
      color:white;
      border:none;
      border-radius:10px;
      margin-top:10px;
    }
  </style>

</head>

<body>

<h2>Scanner Check-in PWA</h2>

<button onclick="startCamera()">📷 Buka Kamera</button>

<video id="video" autoplay></video>

<p id="result"></p>

<script>

let video = document.getElementById("video");
let scanning = false;

// =====================
// CAMERA
// =====================
async function startCamera() {

  try {

    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" }
    });

    video.srcObject = stream;

    scanLoop();

  } catch (err) {
    alert("Kamera gagal: " + err.message);
  }
}

// =====================
// QR DETECTOR
// =====================
async function scanLoop() {

  const detector = new BarcodeDetector({
    formats: ["qr_code"]
  });

  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");

  setInterval(async () => {

    if (scanning) return;
    if (video.readyState !== 4) return;

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.drawImage(video, 0, 0);

    try {

      const codes = await detector.detect(canvas);

      if (codes.length > 0) {

        scanning = true;

        handleScan(codes[0].rawValue);
      }

    } catch (e) {}

  }, 500);
}

// =====================
// HANDLE SCAN
// =====================
function handleScan(text) {

  console.log("RAW QR:", text);

  let data;

  // =========================
  // PARSE JSON QR
  // =========================
  try {
    data = JSON.parse(text);
  } catch (e) {
    document.getElementById("result").innerText =
      "QR tidak valid (bukan JSON)";
    scanning = false;
    return;
  }

  // =========================
  // CEK REGID
  // =========================
  if (!data.regId) {
    document.getElementById("result").innerText =
      "QR tidak punya regId";
    scanning = false;
    return;
  }

  // =========================
  // KIRIM KE GOOGLE SCRIPT
  // =========================
  google.script.run
    .withSuccessHandler(res => {

      const el = document.getElementById("result");

      if (res.success) {

        el.innerHTML =
          "✅ " + data.nama + " (" + data.regId + ") HADIR";

        el.style.color = "lime";

      } else {

        el.innerHTML =
          "❌ " + res.message;

        el.style.color = "red";
      }

      setTimeout(() => scanning = false, 2000);

    })
    .checkInPeserta(data.regId);
}

// =====================
// SERVICE WORKER
// =====================
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js');
}

</script>

</body>
</html>
