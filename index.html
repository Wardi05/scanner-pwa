<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scanner Check-in PWA</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">

  <!-- LIB QR SCANNER (WAJIB INI) -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #111;
      color: white;
      text-align: center;
    }

    header {
      padding: 15px;
      background: #000;
      font-weight: bold;
      font-size: 18px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
    }

    button {
      margin-top: 15px;
      padding: 12px 20px;
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
    }

    #result {
      margin-top: 15px;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header>
    ADMIN SCANNER CHECK-IN
  </header>

  <button onclick="startCamera()">📷 BUKA KAMERA</button>

  <div id="reader"></div>

  <div id="result">Menunggu scan...</div>

  <script>

    let html5QrCode;
    let scanning = false;

    // =========================
    // START CAMERA
    // =========================
   function startCamera() {

  html5QrCode = new Html5Qrcode("reader");

  Html5Qrcode.getCameras().then(cameras => {

    let cameraId = cameras[0].id;

    cameras.forEach(c => {
      if (c.label.toLowerCase().includes("back")) {
        cameraId = c.id;
      }
    });

    html5QrCode.start(
      cameraId,
      {
        fps: 10,
        qrbox: 250
      },
      onScanSuccess
    ).catch(err => {
      alert("Start error: " + err);
    });

  });
}

    // =========================
    // HANDLE SCAN
    // =========================
    function onScanSuccess(text) {

  console.log("RAW QR:", text);

  let data;

  try {
    data = JSON.parse(text);
  } catch (e) {
    showResult("QR tidak valid", "red");
    return;
  }

  if (!data.regId) {
    showResult("QR tidak punya regId", "red");
    return;
  }

  // STOP SCANNER SEMENTARA (WAJIB FIX STUCK)
  html5QrCode.pause(true);

  showResult("Memproses...", "yellow");

  google.script.run
    .withSuccessHandler(res => {

      if (res && res.success) {

        showResult(
          "✅ " + data.nama + " HADIR",
          "lime"
        );

      } else {

        showResult(
          "❌ " + (res?.message || "Gagal check-in"),
          "red"
        );
      }

      // RESUME SCANNER SETELAH 2 DETIK
      setTimeout(() => {
        html5QrCode.resume();
      }, 2000);

    })
    .withFailureHandler(err => {

      showResult("Server error", "red");

      setTimeout(() => {
        html5QrCode.resume();
      }, 2000);

    })
    .checkInPeserta(data.regId);
}

      // =========================
      // KIRIM KE APPS SCRIPT
      // =========================
      google.script.run
        .withSuccessHandler(res => {

          const el = document.getElementById("result");

          if (res.success) {

            el.innerHTML =
              "✅ " + data.nama + " (" + data.regId + ") HADIR";

            el.style.color = "lime";

          } else {

            el.innerHTML =
              "❌ " + res.message;

            el.style.color = "red";
          }

          setTimeout(() => scanning = false, 2000);

        })
        .checkInPeserta(data.regId);
    }
    function showResult(text, color) {
  const el = document.getElementById("result");
  el.innerText = text;
  el.style.color = color;
}

  </script>

</body>

</html>
